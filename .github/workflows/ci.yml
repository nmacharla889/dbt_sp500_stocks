name: CI

# Runs on every pull request into main, and on demand from the Actions tab.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One Databricks run at a time: every run uses the same sp500_ci schemas.
concurrency:
  group: dbt-ci-databricks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notebook:
    name: Notebook runs on committed snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-notebook.txt

      - name: Install notebook dependencies
        run: pip install -r requirements-notebook.txt

      # The notebook stops with an error if pandas and the dbt mart disagree,
      # or if the snapshot row counts change, so a clean run is a real check.
      - name: Execute notebook (SOURCE = "csv")
        run: jupyter nbconvert --to notebook --execute notebooks/sector_risk_return.ipynb --output-dir /tmp/executed

  dbt:
    name: dbt build on Databricks (CI schemas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_CI_SCHEMA: sp500_ci
      # The 94 MB stock table only exists in the dev raw schema. CI reads it there (read only)
      # and builds everything else into its own sp500_ci* schemas.
      DBT_VARS: "{raw_schema: sp500_dev_raw}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Check secrets are set
        run: |
          for name in DATABRICKS_HOST DATABRICKS_HTTP_PATH DATABRICKS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      - name: dbt deps
        run: dbt deps --profiles-dir ci

      - name: dbt debug (connection)
        run: dbt debug --profiles-dir ci

      - name: dbt build (seeds, models, snapshot, tests)
        run: dbt build --profiles-dir ci --vars "$DBT_VARS"

      # Second run exercises the incremental path of fct_weekly_returns.
      # No new weeks arrive, so it should merge nothing and every test should still pass.
      - name: Incremental re-run of fct_weekly_returns
        run: |
          dbt run --profiles-dir ci --vars "$DBT_VARS" --select fct_weekly_returns
          dbt test --profiles-dir ci --vars "$DBT_VARS" --select fct_weekly_returns

      - name: Drop CI schemas
        if: always()
        run: dbt run-operation drop_ci_schemas --profiles-dir ci
