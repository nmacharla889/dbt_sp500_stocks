version: 2

sources:
  - name: sp500_raw
    description: >
      Raw daily stock prices from the Kaggle "S&P 500 Stocks (daily updated)" dataset, loaded into
      Databricks outside dbt because the file (about 94 MB) is too large for a seed.
      The two smaller files (sp500_companies, sp500_index) are dbt seeds and are read with ref(), not source().
    database: stocks
    # Defaults to <target schema>_raw, so dev reads sp500_dev_raw.
    # CI builds into its own schema but has no copy of this 94 MB table, so the CI workflow
    # passes --vars '{raw_schema: sp500_dev_raw}' to read the dev raw table (read only).
    schema: "{{ var('raw_schema', target.schema ~ '_raw') }}"
    tables:
      - name: sp500_stocks
        description: >
          One row per ticker per trading day, 2010-01-04 to 2024-12-20, 502 tickers x 3,768 days = 1,891,536 rows.
          330 tickers have no prices on any day (all price columns null): the source file is missing them,
          most likely from failed downloads when the dataset was last updated. See README, Data Investigation.
