version: 2

exposures:
  - name: sector_risk_return_dashboard
    label: Sector risk and return (Power BI)
    type: dashboard
    maturity: low
    description: >
      Two-page Power BI Desktop report (dashboard/sector_risk_return.pbix) showing return,
      volatility and return per unit of volatility by sector and sub-period.
      It imports mart_sector_risk_return only. It is a companion view to the notebook,
      not a published dashboard, so there is no URL.
    depends_on:
      - ref('mart_sector_risk_return')
    owner:
      name: Nikhil Macharla
      email: nmacharla@outlook.in

  - name: sector_risk_return_notebook
    label: Sector risk and return notebook
    type: notebook
    maturity: medium
    description: >
      notebooks/sector_risk_return.ipynb. Recomputes the mart in pandas, reconciles against it,
      measures uncertainty with a block bootstrap and draws the chart. Reads CSV snapshots in data/
      or the live tables.
    depends_on:
      - ref('fct_sector_weekly_returns')
      - ref('mart_sector_risk_return')
    owner:
      name: Nikhil Macharla
      email: nmacharla@outlook.in
