version: 2

models:
  - name: fct_weekly_returns
    description: >
      Weekly stock facts for the 172 stocks with prices, 2010 onwards. Grain: one row per stock per week (weeks start on Monday).
      Index columns are null before 2014-12-22, because the index source starts then.
      weekly_return is close to close on adjusted prices, in percent, and is null in each stock's first week.
    columns:
      - name: company_key
        data_type: string
        description: "The unique key for the company, derived from the company ticker symbol"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: company_key

      - name: market_cap_bucket
        data_type: string
        description: "The market capitalization bucket to which the company belongs"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mega_cap', 'large_cap', 'big_cap', 'super_mega_cap']

      - name: weekly_return_key
        data_type: string
        description: "Surrogate key from the week start date and the ticker."
        data_tests:
          - not_null
          - unique

      - name: stock_week_start_date
        data_type: timestamp
        description: "The start date of the week for which the stock data is recorded"
        data_tests:
          - not_null

      - name: week_lowest_price
        data_type: double
        description: "Lowest unadjusted price of the week."
        data_tests:
          - not_null

      - name: week_highest_price
        data_type: double
        description: "Highest unadjusted price of the week."
        data_tests:
          - not_null

      - name: avg_stock_price
        data_type: double
        description: "Average adjusted closing price over the week's trading days."
        data_tests:
          - not_null

      - name: total_volume_traded
        data_type: double
        description: "The total volume of the stock that was traded for the given week"
        data_tests:
          - not_null

      - name: index_week_start_date
        data_type: timestamp
        description: "Week start date of the index row. Null before 2014-12-22 (no index data)."
        data_tests:
          - not_null:
              config:
                where: "stock_week_start_date >= '2014-12-22'"

      - name: avg_index_value
        data_type: double
        description: "The average value of the index for the given week"
        data_tests:
          - not_null:
              config:
                where: "stock_week_start_date >= '2014-12-22'"

      - name: min_index_value
        data_type: double
        description: "The minimum value of the index for the given week"
        data_tests:
          - not_null:
              config:
                where: "stock_week_start_date >= '2014-12-22'"

      - name: max_index_value
        data_type: double
        description: "The maximum value of the index for the given week"
        data_tests:
          - not_null:
              config:
                where: "stock_week_start_date >= '2014-12-22'"

      - name: week_opening_price
        data_type: double
        description: "Unadjusted opening price on the first trading day of the week. Not comparable with week_closing_price, which is adjusted."
        data_tests:
          - not_null

      - name: week_closing_price
        data_type: double
        description: "Adjusted closing price (dividends and splits) on the last trading day of the week."
        data_tests:
          - not_null

      - name: weekly_return
        data_type: double
        description: >
          Close-to-close return on adjusted closing prices, in percent:
          this week's last adjusted close / last week's last adjusted close - 1, times 100.
          Null in each stock's first week (see assert_weekly_return_null_only_first_week).
          Checked against an independent daily calculation by assert_weekly_return_reconciles.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 200

      - name: rolling_4w_avg_price
        data_type: double
        description: "The rolling 4-week average price of the stock"
        data_tests:
         - dbt_utils.accepted_range:
            arguments:
              min_value: 0
        
      - name: rolling_12w_volatility
        data_type: double
        description: "Rolling 12-week volatility of weekly log returns, annualised, as a fraction (0.25 = 25%)."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5